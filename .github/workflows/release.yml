# Builds, signs and publishes the provider with goreleaser. The GitHub Release (and its tag)
# is only created once every artifact is built and signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (set by release-please.yml)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    name: Goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Tag locally
        if: ${{ inputs.version != '' }}
        run: git tag "v${{ inputs.version }}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -count=1

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build, sign and publish
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
