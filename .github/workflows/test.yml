name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - run: go vet ./...
      - run: go test ./internal/... -v -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage threshold
        env:
          THRESHOLD: "75"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage: ${total}% (threshold: ${THRESHOLD}%)"
          awk -v total="$total" -v threshold="$THRESHOLD" \
            'BEGIN { exit (total + 0 < threshold) ? 1 : 0 }' \
            || { echo "::error::Coverage ${total}% is below the ${THRESHOLD}% threshold"; exit 1; }
